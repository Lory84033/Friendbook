<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><title>Friendbook Light</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#e9eaed;color:#333;font:13px/1.3 tahoma,verdana,arial,sans-serif}
a{color:#3b5998;cursor:pointer}.hid{display:none}.pad{padding:6px}.sm{margin-top:10px;font-size:11px}

<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><title>Friendbook</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#3b5998"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png">
<script>if(!window.XMLHttpRequest||!window.JSON||!window.localStorage||/Opera Mini/.test(navigator.userAgent))location.replace("lite.html");</script>
<style>
*{box-sizing:border-box;-webkit-box-sizing:border-box;-moz-box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#e9eaed;color:#333;font:11px/1.3 "lucida grande",tahoma,verdana,arial,sans-serif}
a{color:#3b5998;text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
.hid{display:none}.pad{padding:8px 10px;color:#777}.sm{margin-top:12px;font-size:10px}
#top{position:absolute;top:0;left:0;right:0;height:42px;background:#3b5998;border-bottom:1px solid #133783}
#logo{float:left;margin:8px 14px;color:#fff;font:bold 25px/26px "lucida grande",tahoma,sans-serif;letter-spacing:-1px}
#me{float:right;margin:14px 14px;color:#fff}#me a{color:#d8dfea;margin-left:10px}
#back{display:none;float:left;margin:14px 0 0 12px;color:#fff;font-weight:bold}
#wrap{position:absolute;top:42px;bottom:0;left:0;right:0}
#list{position:absolute;top:0;bottom:0;left:0;width:260px;background:#f7f7f7;border-right:1px solid #ccc;overflow:auto}
#tabs{height:30px;background:#f6f7f9;border-bottom:1px solid #d8dfea}
#tabs a{float:left;width:33.3%;height:30px;line-height:29px;text-align:center;color:#4e5665;font-weight:bold;border-bottom:3px solid transparent}
#tabs a.on{color:#3b5998;border-bottom-color:#3b5998;background:#fff;text-decoration:none}
#list h3{margin:0;padding:5px 10px;background:#eceff5;border-top:1px solid #d8dfea;border-bottom:1px solid #d8dfea;color:#4e5665;font-size:11px}
.box{padding:8px 10px;background:#fff;border-bottom:1px solid #ddd}
.box input,#auth input{display:block;width:100%;margin-bottom:6px;padding:6px;border:1px solid #bdc7d8;border-radius:0;font:12px "lucida grande",tahoma,sans-serif}
.u{display:block;padding:5px 10px;border-bottom:1px solid #e5e5e5;min-height:41px;overflow:hidden;color:#333;background:#fff}
.u:hover{background:#eceff5;text-decoration:none}
.av{float:left;width:30px;height:30px;margin-right:9px;color:#fff;font:bold 16px/30px arial,sans-serif;text-align:center;text-transform:uppercase;border:1px solid rgba(0,0,0,.25)}
.u b{display:block;line-height:30px;color:#3b5998}.act{float:right;line-height:30px}.act a{margin-left:8px}
.st div{margin-left:39px;font-size:12px;word-wrap:break-word;clear:none}.st i{display:block;margin-left:39px;font-style:normal;color:#999;font-size:10px}.st b{line-height:14px}
#chat{position:absolute;top:0;bottom:0;left:261px;right:0;background:#fff}
#ct{position:absolute;top:0;left:0;right:0;height:30px;padding:8px 12px;background:#f6f7f9;border-bottom:1px solid #d8dfea;font:bold 12px "lucida grande",tahoma,sans-serif;color:#3b5998}
#msgs{position:absolute;top:30px;bottom:76px;left:0;right:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 12px}
.m{padding:7px 0;border-bottom:1px solid #e9eaed;overflow:hidden}.m .av{width:32px;height:32px;line-height:32px;font-size:17px}
.t{margin-left:41px;font-size:12px;word-wrap:break-word}.t b{color:#3b5998}.t i{display:block;font-style:normal;color:#999;font-size:10px}
#bar{position:absolute;bottom:0;left:0;right:0;height:76px;padding:6px 12px;background:#f6f7f9;border-top:1px solid #ccc}
#em{height:22px;font-size:17px;line-height:20px;white-space:nowrap;overflow:hidden}#em a{margin-right:8px}
#msg{float:left;width:68%;height:30px;margin-top:2px;padding:4px 6px;border:1px solid #bdc7d8;font:12px "lucida grande",tahoma,sans-serif}
.btn{height:30px;margin:2px 0 0 6px;padding:0 12px;background:#4267b2;background:#5b74a8;border:1px solid #29447e;border-bottom-color:#1a356e;color:#fff;font:bold 11px "lucida grande",tahoma,sans-serif;cursor:pointer}
.btn.g{background:#f6f7f9;border-color:#ced0d4;color:#4b4f56}.box .btn{margin:0}
#rf{display:inline-block;margin-left:8px;line-height:34px}
#auth{width:310px;max-width:94%;margin:50px auto;background:#fff;border:1px solid #ccc;padding:16px;text-align:center}
#auth h2{margin:0 0 4px;color:#3b5998;font:bold 32px "lucida grande",tahoma,sans-serif;letter-spacing:-1px}
#auth p{margin:0 0 12px;color:#666}#err{min-height:15px;margin-bottom:6px;color:#c00}
@media (max-width:699px){#list{width:100%;border:0}#chat{left:0;display:none}body.ch #list{display:none}body.ch #chat{display:block}body.ch #back{display:block}body.ch #logo{display:none}#msg{width:60%}}
</style></head><body><div id="root"></div>
<script src="config.js"></script><script src="app.js"></script></body></html>
